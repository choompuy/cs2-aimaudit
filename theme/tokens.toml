# ============================================================================
# CS2-AimAudit — design tokens. The single source of truth for every colour,
# radius, shadow, spacing and font size in the app. Charts, Styler tables,
# HTML chips and .streamlit/config.toml all derive from this file.
#
# Layers
#   [primitive.*]  raw named values; references are not allowed in here
#   [semantic.*]   the design tokens; a value is either a primitive name
#                  (resolved automatically) or a literal (#hex, 12px, 0.25rem)
#   [themes.*]     per-theme overrides merged on top of [semantic]
#
# Active theme: the AIMAUDIT_THEME environment variable, default "violet".
# [themes.violet] is empty on purpose — violet IS the set of defaults.
#
# How to change the palette: edit values here, then run
#     python tools/sync_theme.py
# and restart the app. sync_theme.py regenerates the [theme] section of
# .streamlit/config.toml (native widgets); charts and tables read tokens
# directly at import time.
#
# How to switch theme (the env var must be set for BOTH steps — native
# widgets read config.toml, charts and chips read the tokens directly):
#     AIMAUDIT_THEME=green python tools/sync_theme.py
#     AIMAUDIT_THEME=green ./start.sh          # or start.bat
#
# Contrast: tests/check_ui.py verifies WCAG AA (>= 4.5:1) for text-primary /
# text-secondary on every surface and text-inverse on accent, in every theme.
# ============================================================================

[primitive]
# --- violet-tinted dark neutrals (default theme surfaces)
v950 = "#15141c"
v900 = "#1d1b26"
v850 = "#25232f"
v800 = "#2e2b3a"
v750 = "#34313f"
v700 = "#413e50"
# --- green-tinted near-black neutrals (green theme surfaces, refs 4-6)
g950 = "#0c100e"
g900 = "#131714"
g850 = "#1a1f1c"
g800 = "#222a26"
g750 = "#2b352f"
g700 = "#3a4a41"
# --- text ramps (violet theme / green theme)
ink-hi = "#f2f1f7"
ink-mid = "#a7a4b5"
ink-lo = "#6f6c80"
mint-hi = "#eef3ef"
mint-mid = "#9fada4"
mint-lo = "#67736b"
# --- brand roles
pink-500 = "#e8507f"    # "you" accent, violet theme
violet-500 = "#7c4fd0"  # "opponent", violet theme
green-500 = "#3ddc84"   # "you" accent, green theme
amber-500 = "#f0a950"   # "opponent", green theme
# --- status / value tiers (colour-blind-safe hues, Okabe-Ito derived)
teal-400 = "#4fd1b0"    # tier elite
lime-400 = "#8fd16a"    # tier good
yellow-400 = "#e6c34a"  # tier mid / warning
orange-400 = "#ef8a4c"  # tier poor
red-400 = "#e8625a"     # tier bad / loss
win-400 = "#5fd0a0"     # result win / positive
blue-400 = "#56b4e9"    # info / good-series
grey-400 = "#8899aa"    # context series (misses, baselines, thresholds)
# --- subtle team row tints (backgrounds, not text colours)
tint-t = "#2a2118"
tint-ct = "#182432"
# --- accent-tinted backgrounds (~20-25% blend on surface)
pink-soft = "#3d2535"
pink-strong = "#4a2a40"
violet-soft = "#2e2646"
green-soft = "#1b3e2c"
green-strong = "#234e36"
amber-soft = "#3f3420"

# ---------------------------------------------------------------- semantic
# Defaults = the violet theme. A value may name a primitive ("pink-500")
# or another token ("accent"): aliases below keep the palette consistent —
# chart-1 = "accent" means a new accent automatically leads the chart
# palette too. chart-3..6 stay colour-blind-safe across themes.

[semantic]
bg-app = "v950"
surface-1 = "v900"
surface-2 = "v850"
surface-3 = "v800"
border-subtle = "v750"
border-strong = "v700"
text-primary = "ink-hi"
text-secondary = "ink-mid"
text-muted = "ink-lo"
text-inverse = "v950"            # text on accent / status chips
accent = "pink-500"              # "you"
accent-soft = "pink-soft"        # accent-tinted background (hover, chips)
opponent = "violet-500"          # "opponent"
opponent-soft = "violet-soft"    # opponent-tinted background
positive = "win-400"
warning = "yellow-400"
negative = "red-400"
info = "blue-400"
result-win = "positive"
result-loss = "negative"
team-t = "tint-t"                # T row background tint
team-ct = "tint-ct"              # CT row background tint
surface-selected = "pink-strong" # selected row highlight
context = "grey-400"             # context series: misses, baselines, thresholds
chart-1 = "accent"               # categorical palette leads with the brand pair
chart-2 = "opponent"
chart-3 = "blue-400"
chart-4 = "teal-400"
chart-5 = "yellow-400"
chart-6 = "grey-400"
chart-grid = "border-subtle"
chart-axis = "text-secondary"

[semantic.tier]
elite = "teal-400"
good = "lime-400"
neutral = "text-secondary"
mid = "yellow-400"
poor = "orange-400"
bad = "red-400"

[semantic.radius]
sm = "0.25rem"    # matches the Streamlit baseRadius the app ships with
md = "0.375rem"
lg = "0.5rem"
pill = "999px"

[semantic.space]
xs = "4px"
sm = "8px"
md = "12px"
lg = "16px"
xl = "24px"

[semantic.shadow]
sm = "0 1px 2px rgba(0,0,0,0.4)"
md = "0 8px 24px rgba(0,0,0,0.5)"

[semantic.font]
# family-ui: the single family name, must match [[fontface]].family and
# becomes [theme].font in .streamlit/config.toml.
family-ui = "Inter"
# family-stack: CSS/Plotly font stack built on family-ui.
family-stack = "Inter, system-ui, 'Segoe UI', sans-serif"
size-xs = "11px"
size-sm = "12px"
size-md = "14px"
size-lg = "17px"
size-xl = "21px"
size-2xl = "28px"
weight-medium = "500"
weight-semibold = "600"
weight-bold = "700"

# ---------------------------------------------------------------- themes
# Each table overrides [semantic] tokens (same key names, may use dotted
# keys like tier.neutral). Unknown keys are an error — see theme/loader.py.

[themes.violet]
# Violet is the default look: its values ARE the [semantic] defaults above,
# so this table stays empty on purpose. Only add overrides if violet should
# ever differ from the defaults.

[themes.green]
# Near-black background, neutral grey surfaces, green accent (refs 4-6).
# chart-1/2, chart-grid/axis and tier.neutral need no overrides: they are
# aliases of accent / opponent / border-subtle / text-secondary above.
bg-app = "g950"
surface-1 = "g900"
surface-2 = "g850"
surface-3 = "g800"
border-subtle = "g750"
border-strong = "g700"
text-primary = "mint-hi"
text-secondary = "mint-mid"
text-muted = "mint-lo"
text-inverse = "g950"
accent = "green-500"
accent-soft = "green-soft"
opponent = "amber-500"
opponent-soft = "amber-soft"
surface-selected = "green-strong"

# ---------------------------------------------------------------- fonts
# Local font files (SIL OFL 1.1, license in static/fonts/OFL.txt) served
# from static/fonts/ through server.enableStaticServing — the app never
# fetches fonts from the network: no Google Fonts, no CDN.
# "file" is the path in the repo, "url" is the served URL, "weight" is the
# variable-font range. sync_theme.py turns these tables into
# [[theme.fontFaces]] in .streamlit/config.toml; family must match
# font.family-ui above.

[[fontface]]
family = "Inter"
file = "static/fonts/InterVariable.woff2"
url = "app/static/fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"
