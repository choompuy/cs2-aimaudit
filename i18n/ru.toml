rr_howto = "Карта: синий — CT, оранжевый — T. Конус и носик показывают, куда смотрит игрок, кольцо — HP (красное, если меньше 30), под точкой оружие. Ослеплённый игрок белый: кольцо вокруг него и число секунд тают до конца блайнда, то же видно на карточке слева. Колёсико — зум, перетаскивание — сдвиг, двойной клик — сброс.\nИгроки: наведите на карточку или на маркер, чтобы найти одного и того же игрока в списке и на карте. Глазик убирает игрока с карты, кнопка «Имена» — имена всех.\nДуэли: клик по карточке запирает ползунок в её отрезке и открывает панель с прицелом обоих дуэлянтов; клик по графику перематывает. Повторный клик или ✕ отпускает.\nТаймлайн: столбик с кружком — килл (цвет команды убийцы), полоса снизу — дуэль, иконки сверху — бомба и конец раунда.\nКлавиши после клика по карте или таймлайну: пробел — играть / пауза, ← → — один сэмпл, Shift + ← → — секунда, [ ] — скорость, F — полный экран, Home / End — начало / конец.\nРаунды: цвет — победившая сторона, иконка — чем закончился раунд."
