rr_howto = "Весь раунд для всех: точка на игрока (синяя — CT, жёлтая — T), стрелка показывает, куда он смотрит, под именем полоска HP и оружие в руках; пунктирное кольцо — игрок движется быстрее порога остановки. Плашка над картой говорит, кто выиграл раунд и как (бомба взорвалась, бомбу разминировали, убили всех, вышло время), установка, разминирование и взрыв бомбы отмечены на таймлайне. Список слева разделён на CT и T и отсортирован по нику внутри команды, поэтому каждый игрок всегда на своём месте; это таблица: оружие в руках, броня (со шлемом), HP, деньги, гранаты, кусачки или бомба, скорость в реальном времени и стоимость закупа, а под ней деньги и закуп обеих команд; у каждой иконки название появляется при наведении, а глазик скрывает игрока с карты (верхний глазик скрывает или показывает всех). Колёсико зумит радар, перетаскивание левой кнопкой двигает карту, двойной клик сбрасывает вид. Кнопка скорости открывает меню от 0.1x до 4x (наведением или кликом; при фокусе на таймлайне [ и ] меняют скорость, стрелки влево/вправо шагают на один сэмпл, Shift — на секунду, пробел — play). Отметки убийств на таймлайне синие от CT, жёлтые от T. Карточка справа — дуэль любого игрока: она запирает ползунок в отрезок этой дуэли и открывает панель дуэли — для обоих дуэлянтов скорость, как быстро поворачивается прицел и угол между прицелом и головой врага в реальном времени, график этого на всей дуэли со всеми выстрелами, числа, измеренные на первом выстреле, и нажатые клавиши; клик по графику перематывает. Повторный клик по карточке (или кнопка ✕) отпускает. Раунды под таймлайном подсвечены цветом победившей стороны и помечены тем, как закончился раунд — клик переключает реплей на раунд."
