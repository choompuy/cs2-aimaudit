rr_howto = "Map: blue is CT, orange is T. The cone and the nose show where a player looks, the ring is the HP (red under 30), the weapon is under the dot. A blinded player is white: the ring around him and the seconds run out with the blindness, his card on the left shows the same. The wheel zooms, a drag pans, a double click resets.\nPlayers: point at a card or at a marker to find the same player in the list and on the map. The eye takes a player off the map, the Names button hides everyone's names.\nDuels: a click on a card locks the playhead to its segment and opens the panel with the aim of both duelists; a click on the chart jumps. A second click or ✕ releases.\nTimeline: a bar with a head is a kill (the killer's team colour), a strip at the bottom is a duel, the icons above are the bomb and the end of the round.\nKeys after a click on the map or the timeline: Space plays / pauses, ← → one sample, Shift + ← → one second, [ ] speed, F full screen, Home / End the ends.\nRounds: the colour is the winning side, the icon is how the round ended."
