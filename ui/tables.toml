# ============================================================================
# CS2-AimAudit — table schema. The single source of truth for the grid
# tables (ui/table.py renderer): which columns exist, their formats, sort
# directions, bars, grading and stripes. The same idea as theme/tokens.toml
# for the palette: a new column or table is added here, not in app.py.
#
# Layers
#   [metric.<id>]            one column definition: format, sorting, grading.
#                            label is an i18n key (default "col_<id>").
#   [table.<id>]             column order, the Basic subset, stripe rule,
#                            height, selection. "extra" lists data columns
#                            the rows carry but never display (sort keys,
#                            stripe sources).
#   [table.<id>.override.<col>]
#                            per-table tweaks on top of the metric: label,
#                            grade, sticky, even kind.
#
# Values
#   kind   num | text | badge                (default num)
#   fmt    str.format spec for numbers, units inside ("{:.1f}%", "{:.0f} u")
#   best   high | low | none                 what sorts and grades first
#   grade  none | auto | [bad, good] | [bad, ok, good]
#          value colour, three levels only (ui/common.js gradeLevel): below
#          ok = red, at or past good = green, between = plain text;
#          "auto" = position in the column
#   bar    none | pct | rel                  background bar: 0..100 or a
#          share of the column maximum
#   tone   colour token name for the bar / badge (accent, context, ...)
#   sort_by  another data column holding the raw sort value
#   sticky   pin the column while the table scrolls horizontally
#   tones  badge colour map: raw/display value -> tone token
#
# tests/test_tables.py validates this file (i18n keys exist, fmt formats,
# grade/best/bar/tone values are legal, basic ⊆ columns, references
# resolve, colour tokens exist in theme/).
# ============================================================================

# ------------------------------------------------------------------ metrics
[metric.player]
kind = "text"
sort_by = "player_raw"
sticky = true

[metric.team]
kind = "badge"
tones = { T = "warning", CT = "info" }

[metric.kdr]
fmt = "{:.2f}"
best = "high"
help = "col_kdr_help"

[metric.kills]
fmt = "{:.0f}"
bar = "rel"
tone = "context"
best = "high"

[metric.deaths]
fmt = "{:.0f}"
bar = "rel"
tone = "context"
best = "low"

[metric.shots]
fmt = "{:.0f}"
bar = "rel"
tone = "context"

[metric.hits]
fmt = "{:.0f}"
bar = "rel"
tone = "context"

[metric.accuracy]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
grade = [10, 18, 28]

[metric.hs_hits]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
grade = [15, 25, 40]

[metric.hs_kills]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
grade = [20, 40, 60]

[metric.moving]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "low"
grade = [50, 30, 15]

[metric.risky]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "low"
grade = [30, 15, 5]

[metric.first_shot]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
grade = [35, 50, 65]

[metric.first_acc]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
grade = [15, 25, 40]

[metric.open_rate]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
label = "col_open"
help = "col_open_help"
grade = [35, 50, 65]

[metric.sides]
kind = "text"

[metric.aim_err]
fmt = "{:.1f}°"
best = "low"
grade = [6, 3, 1.5]
bar = "rel"
tone = "context"

[metric.duration]
fmt = "{:.2f} s"
best = "low"
bar = "rel"
tone = "context"

[metric.weapon]
# the weapon silhouette (CS2 kill-feed style): icon only, the localized
# name rides in the tooltip (title) and replaces the icon as plain text
# when the icon set is not installed; rows carry the name in weapon_disp
kind = "icon"
title_by = "weapon_disp"
sort_by = "weapon_disp"

# icon columns of the overview: the favorite weapon and the one dying to
[metric.best_weapon]
kind = "icon"
title_by = "best_weapon_disp"
sort_by = "best_weapon_disp"
label = "col_best_weapon"
help = "col_best_weapon_help"

[metric.died_to]
kind = "icon"
title_by = "died_to_disp"
sort_by = "died_to_disp"
label = "col_died_to"
help = "col_died_to_help"

[metric.median_speed]
fmt = "{:.0f} u/s"
best = "low"
grade = [100, 40, 15]

[metric.median_dist]
fmt = "{:.0f} u"

# duels: a headshot flag (✓ / empty); the weapons table overrides it into
# the "HS (of hits)" percentage - same data column name, different meaning
[metric.hs]
kind = "text"
sort_by = "hs_raw"

[metric.round]
fmt = "{:.0f}"
best = "low"

[metric.round_sec]
fmt = "{:.1f} s"
best = "low"
help = "col_round_sec_help"

[metric.result]
kind = "badge"
sort_by = "result_raw"
tones = { kill = "positive", death = "negative" }

[metric.opponent]
kind = "text"
sticky = true

[metric.distance]
fmt = "{:.0f} u"
bar = "rel"
tone = "context"

[metric.zone]
kind = "text"
help = "col_zone_help"

[metric.first]
kind = "badge"
sort_by = "first_raw"
tones = { me = "positive", opponent = "negative", simultaneous = "warning" }

[metric.my_shots]
fmt = "{:.0f}"
bar = "rel"
tone = "context"

[metric.opp_shots]
fmt = "{:.0f}"
bar = "rel"
tone = "context"

[metric.speed]
fmt = "{:.0f} u/s"
best = "low"
grade = [100, 40, 15]
bar = "rel"
tone = "context"

[metric.errhw]
fmt = "{:.2f}"
best = "low"

[metric.side]
kind = "text"

[metric.flags]
kind = "text"

[metric.tick]
fmt = "{:.0f}"
best = "low"

# ------------------------------------------------------------------- tables
# The unified match list (Matches page): one row per match from every
# source. The date column sorts through a hidden raw column that carries
# NEGATIVE timestamps (the renderer's first text-column click sorts
# ascending, so newest-first reads as one click); the score is a badge
# coloured by the result with the W/L/D letter inside - never colour alone.
[table.matches]
columns = [
  "mmap", "mdate", "mscore", "mkills", "mdeaths", "mkdr", "macc", "msrc",
  "mact",
]
extra = ["date_sort", "result_raw", "src_raw"]
selectable = true

[metric.mmap]
kind = "text"
label = "col_mmap"

[metric.mdate]
kind = "text"
sort_by = "date_sort"
help = "col_mdate_help"

[metric.mscore]
kind = "badge"
sort_by = "result_raw"
tones = { win = "positive", loss = "negative", tie = "info" }
help = "col_mscore_help"

[metric.mkills]
fmt = "{:.0f}"
best = "high"
label = "col_kills"

[metric.mdeaths]
fmt = "{:.0f}"
best = "low"
label = "col_deaths"

[metric.mkdr]
fmt = "{:.2f}"
best = "high"
label = "col_kdr"
help = "col_kdr_help"

[metric.macc]
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
label = "col_accuracy"

[metric.msrc]
kind = "text"
sort_by = "src_raw"
label = "col_msrc"

[metric.mact]
kind = "text"
help = "col_mact_help"

# One table for both teams (Team column + subtle team tint); ~9 columns
# by default, "All columns" adds the detail metrics.
[table.overview]
columns = [
  "player", "team", "kdr", "kills", "deaths", "shots", "hits", "accuracy",
  "hs_hits", "hs_kills", "moving", "risky", "first_shot", "first_acc",
  "open_rate", "sides", "aim_err", "duration", "best_weapon", "died_to",
]
basic = [
  "player", "team", "kdr", "kills", "deaths", "accuracy", "hs_hits",
  "risky", "first_shot",
]
stripe = { field = "team", map = { T = "warning", CT = "info" } }
extra = ["player_raw", "best_weapon_disp", "died_to_disp"]
selectable = true

# K/D gets a fixed grading scale only here: below 0.7 slides to red,
# 1.0 stays the neutral text colour, above climbs to green
[table.overview.override.kdr]
grade = [0.7, 1.0, 1.4]

# Weapons of the selected player: no Basic/All split, no selection.
[table.weapons]
columns = [
  "weapon", "shots", "median_speed", "median_dist", "moving", "risky",
  "hits", "hs", "accuracy", "first_acc",
]
extra = ["weapon_disp"]

[table.weapons.override.weapon]
sticky = true

[table.weapons.override.moving]
label = "col_moving_w"

[table.weapons.override.risky]
label = "col_risky_w"

# weapon_stats names the headshot-percentage column "hs"; shown with the
# same conventions as the overview's hs_hits
[table.weapons.override.hs]
kind = "num"
fmt = "{:.1f}%"
bar = "pct"
tone = "context"
best = "high"
label = "col_hs_hits"
sort_by = "none"
grade = [15, 25, 40]

# ~9 columns by default (aim error and speed coloured by the same norms as the
# Shooting tiles), "All columns" reveals the detail metrics and the
# technical tick column; the opponent name stays pinned when the full
# table scrolls horizontally.
[table.duels]
columns = [
  "round", "round_sec", "result", "opponent", "weapon", "hs", "distance",
  "zone", "first", "aim_err", "my_shots", "opp_shots", "duration", "speed",
  "errhw", "side", "flags", "tick",
]
basic = [
  "round", "result", "opponent", "weapon", "hs", "distance", "first", "aim_err",
  "speed",
]
stripe = { field = "result_raw", map = { kill = "positive", death = "negative" }, default = "negative" }
extra = ["result_raw", "first_raw", "hs_raw", "weapon_disp"]
max_height = 720
selectable = true

[table.duels.override.aim_err]
label = "col_err"
