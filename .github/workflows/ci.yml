name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays) upstream check: the matrix installs the newest
    # versions allowed by the requirements.txt ceilings, so scheduled
    # runs catch upstream breakage early.
    - cron: "23 5 * * 1"
  workflow_dispatch:

env:
  # Windows runners default to cp1252 for consoles/pipes, while the test
  # output contains →, ≈ and Cyrillic: UTF-8 mode keeps the prints from
  # UnicodeEncodeError. The test scripts reconfigure stdout/stderr as a
  # belt-and-suspenders fallback for local Windows runs.
  PYTHONUTF8: "1"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # demoparser2 publishes CPython 3.11-3.14 wheels for Linux and
        # Windows only: no macOS wheels and no sdist since 0.42.1, so a
        # macOS job cannot even install it. Re-add macOS when upstream
        # ships wheels again.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m py_compile app.py core.py i18n.py mapview.py theme/__init__.py theme/loader.py tools/sync_theme.py tools/inspect_rounds.py tools/fetch_radars.py ui/__init__.py ui/table.py
      - name: Core tests (synthetic demo, no .dem needed)
        run: python tests/test_core.py
      - name: UI consistency checks
        run: python tests/check_ui.py
      - name: UI smoke test (real app.py on synthetic demos)
        run: python tests/smoke_app.py --fast

  smoke-all:
    # One full run (every page and locale) per commit is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m py_compile app.py core.py i18n.py mapview.py theme/__init__.py theme/loader.py tools/sync_theme.py tools/inspect_rounds.py tools/fetch_radars.py ui/__init__.py ui/table.py
      - name: Full UI smoke test
        run: python tests/smoke_app.py --all

  floors:
    # The requirements.txt floors must be honest: install the lowest
    # allowed versions on the lowest supported Python and run the same
    # three test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install the lowest allowed versions
        run: uv pip install --resolution lowest-direct -r requirements.txt --system
      - name: Byte-compile sources
        run: python -m py_compile app.py core.py i18n.py mapview.py theme/__init__.py theme/loader.py tools/sync_theme.py tools/inspect_rounds.py tools/fetch_radars.py ui/__init__.py ui/table.py
      - name: Core tests (synthetic demo, no .dem needed)
        run: python tests/test_core.py
      - name: UI consistency checks
        run: python tests/check_ui.py
      - name: UI smoke test (fast)
        run: python tests/smoke_app.py --fast
