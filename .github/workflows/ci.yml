name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays) upstream check: direct dependencies are pinned
    # exactly in requirements.txt, but transitive dependencies still
    # float, so scheduled runs catch their breakage (and runner image
    # updates) early.
    - cron: "23 5 * * 1"
  workflow_dispatch:

env:
  # Windows runners default to cp1252 for consoles/pipes, while the test
  # output contains →, ≈ and Cyrillic: UTF-8 mode keeps the prints from
  # UnicodeEncodeError. The test scripts reconfigure stdout/stderr as a
  # belt-and-suspenders fallback for local Windows runs.
  PYTHONUTF8: "1"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # CS2-AimAudit supports Windows only (the launcher is start.bat),
        # so the tests run on Windows only. The matrix is about OSes only:
        # Python is pinned to a single version, matching the exact
        # dependency pins in requirements.txt - the suite is only
        # guaranteed on this interpreter. Bump the pin (here + README +
        # requirements + start.bat) deliberately, like any other dependency.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m compileall -q app.py core i18n.py mapview.py store.py context.py filters_ui.py shell.py ui views theme tools
      - name: Core tests (synthetic demo, no .dem needed)
        run: python tests/test_core.py
      - name: UI consistency checks
        run: python tests/check_ui.py
      - name: UI smoke test (real app.py on synthetic demos)
        run: python tests/smoke_app.py --fast

  smoke-all:
    # One full run (every page and locale) per commit is enough.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m compileall -q app.py core i18n.py mapview.py store.py context.py filters_ui.py shell.py ui views theme tools
      - name: Full UI smoke test
        run: python tests/smoke_app.py --all
