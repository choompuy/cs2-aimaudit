name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays) upstream check: direct dependencies are pinned
    # exactly in requirements.txt, transitive ones float.
    - cron: "23 5 * * 1"
  workflow_dispatch:

env:
  # Windows runners default to cp1252 for consoles/pipes
  PYTHONUTF8: "1"

jobs:
  tests:
    # Windows only, one Python: the same as start.bat supports. Bump the pin
    # together with README, requirements and start.bat.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install the JS test dependencies
        run: npm ci --prefix tests/js
      - name: Tests (every page and locale, deep random walk)
        run: pytest --full
