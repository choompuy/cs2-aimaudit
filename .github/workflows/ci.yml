name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Most players are on Windows; macOS/arm64 wheels for demoparser2
        # and zstandard are published for these versions.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m py_compile app.py core.py i18n.py
      - name: Core tests (synthetic demo, no .dem needed)
        run: python tests/test_core.py
      - name: UI consistency checks
        run: python tests/check_ui.py
