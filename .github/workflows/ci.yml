name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile sources
        run: python -m py_compile app.py core.py i18n.py
      - name: Core tests (synthetic demo, no .dem needed)
        run: python tests/test_core.py
      - name: UI consistency checks
        run: python tests/check_ui.py
